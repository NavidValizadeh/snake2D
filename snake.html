<!DOCTYPE html>
<html>
<head>
  <title>Snake Game</title>
  <style>
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      background-color: #f0f0f0;
      font-family: Arial, sans-serif;
    }
    .game-container {
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    #game-board {
      border: 2px solid #333;
      background-color: #222;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.3);
    }
    .controls {
      margin-top: 20px;
      display: flex;
      gap: 10px;
    }
    button {
      padding: 8px 16px;
      background-color: #4CAF50;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 16px;
    }
    button:hover {
      background-color: #45a049;
    }
    .score-container {
      margin-bottom: 10px;
      font-size: 20px;
      font-weight: bold;
    }
    .game-over {
      position: absolute;
      background-color: rgba(0, 0, 0, 0.7);
      color: white;
      padding: 20px;
      border-radius: 10px;
      text-align: center;
      display: none;
    }
    .game-over h2 {
      margin-top: 0;
    }
  </style>
</head>
<body>
  <div class="game-container">
    <div class="score-container">Score: <span id="score">0</span></div>
    <canvas id="game-board" width="400" height="400"></canvas>
    <div class="controls">
      <button id="start-btn">Start Game</button>
      <button id="reset-btn">Reset</button>
    </div>
    <div class="game-over" id="game-over">
      <h2>Game Over!</h2>
      <p>Your final score: <span id="final-score">0</span></p>
      <button id="play-again-btn">Play Again</button>
    </div>
  </div>

  <script>
    // Game variables
    const canvas = document.getElementById('game-board');
    const ctx = canvas.getContext('2d');
    const startBtn = document.getElementById('start-btn');
    const resetBtn = document.getElementById('reset-btn');
    const gameOverElement = document.getElementById('game-over');
    const finalScoreElement = document.getElementById('final-score');
    const playAgainBtn = document.getElementById('play-again-btn');
    const scoreElement = document.getElementById('score');
    
    const gridSize = 20;
    const tileCount = canvas.width / gridSize;
    
    let snake = [];
    let food = {};
    let dx = gridSize;
    let dy = 0;
    let score = 0;
    let gameRunning = false;
    let gameLoop;
    
    // Initialize the game
    function initGame() {
      // Reset snake
      snake = [
        { x: 5 * gridSize, y: 5 * gridSize },
        { x: 4 * gridSize, y: 5 * gridSize },
        { x: 3 * gridSize, y: 5 * gridSize }
      ];
      
      // Reset direction
      dx = gridSize;
      dy = 0;
      
      // Reset score
      score = 0;
      scoreElement.textContent = score;
      
      // Place food
      placeFood();
      
      // Hide game over screen
      gameOverElement.style.display = 'none';
    }
    
    // Place food in a random position
    function placeFood() {
      // Generate random coordinates
      let randomX = Math.floor(Math.random() * tileCount) * gridSize;
      let randomY = Math.floor(Math.random() * tileCount) * gridSize;
      
      // Make sure food doesn't appear on the snake
      let foodOnSnake = true;
      while (foodOnSnake) {
        foodOnSnake = false;
        for (let i = 0; i < snake.length; i++) {
          if (snake[i].x === randomX && snake[i].y === randomY) {
            foodOnSnake = true;
            randomX = Math.floor(Math.random() * tileCount) * gridSize;
            randomY = Math.floor(Math.random() * tileCount) * gridSize;
            break;
          }
        }
      }
      
      food = {
        x: randomX,
        y: randomY
      };
    }
    
    // Draw everything on the canvas
    function draw() {
      // Clear canvas
      ctx.fillStyle = '#222';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      
      // Draw snake
      for (let i = 0; i < snake.length; i++) {
        ctx.fillStyle = i === 0 ? '#4CAF50' : '#8BC34A';
        ctx.fillRect(snake[i].x, snake[i].y, gridSize, gridSize);
        
        // Draw border for the snake segments
        ctx.strokeStyle = '#2E7D32';
        ctx.strokeRect(snake[i].x, snake[i].y, gridSize, gridSize);
      }
      
      // Draw food
      ctx.fillStyle = '#FF5722';
      ctx.beginPath();
      ctx.arc(
        food.x + gridSize / 2,
        food.y + gridSize / 2,
        gridSize / 2,
        0,
        Math.PI * 2
      );
      ctx.fill();
    }
    
    // Update game state
    function update() {
      // Move snake
      const head = { x: snake[0].x + dx, y: snake[0].y + dy };
      
      // Check for wall collision
      if (
        head.x < 0 ||
        head.y < 0 ||
        head.x >= canvas.width ||
        head.y >= canvas.height
      ) {
        gameOver();
        return;
      }
      
      // Check for self collision
      for (let i = 0; i < snake.length; i++) {
        if (head.x === snake[i].x && head.y === snake[i].y) {
          gameOver();
          return;
        }
      }
      
      // Insert new head
      snake.unshift(head);
      
      // Check if food was eaten
      if (head.x === food.x && head.y === food.y) {
        // Increase score
        score += 10;
        scoreElement.textContent = score;
        
        // Place new food
        placeFood();
      } else {
        // Remove tail
        snake.pop();
      }
    }
    
    // Game loop
    function gameStep() {
      update();
      draw();
    }
    
    // Game over function
    function gameOver() {
      clearInterval(gameLoop);
      gameRunning = false;
      finalScoreElement.textContent = score;
      gameOverElement.style.display = 'block';
    }
    
    // Start game
    function startGame() {
      if (!gameRunning) {
        initGame();
        gameRunning = true;
        gameLoop = setInterval(gameStep, 100);
      }
    }
    
    // Reset game
    function resetGame() {
      clearInterval(gameLoop);
      gameRunning = false;
      initGame();
      draw();
    }
    
    // Event listeners
    startBtn.addEventListener('click', startGame);
    resetBtn.addEventListener('click', resetGame);
    playAgainBtn.addEventListener('click', startGame);
    
    // Keyboard controls
    document.addEventListener('keydown', function(event) {
      // Prevent the default action (scrolling)
      if([32, 37, 38, 39, 40].indexOf(event.keyCode) > -1) {
        event.preventDefault();
      }
      
      // Arrow keys
      switch (event.key) {
        case 'ArrowLeft':
          if (dx === 0) { // Only change direction if not moving horizontally
            dx = -gridSize;
            dy = 0;
          }
          break;
        case 'ArrowUp':
          if (dy === 0) { // Only change direction if not moving vertically
            dx = 0;
            dy = -gridSize;
          }
          break;
        case 'ArrowRight':
          if (dx === 0) { // Only change direction if not moving horizontally
            dx = gridSize;
            dy = 0;
          }
          break;
        case 'ArrowDown':
          if (dy === 0) { // Only change direction if not moving vertically
            dx = 0;
            dy = gridSize;
          }
          break;
      }
    });
    
    // Initialize game on load
    window.onload = function() {
      initGame();
      draw();
    };
  </script>
</body>
</html>
