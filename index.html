<!DOCTYPE html>
<html>
<head>
  <title>Snake Game</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <style>
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      background-color: #f0f0f0;
      font-family: Arial, sans-serif;
      touch-action: none;
      overflow: hidden;
    }
    .game-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      max-width: 500px;
    }
    #game-board {
      border: 2px solid #333;
      background-color: #222;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.3);
      max-width: 100%;
    }
    .controls {
      margin-top: 20px;
      display: flex;
      gap: 10px;
    }
    button {
      padding: 8px 16px;
      background-color: #4CAF50;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 16px;
      user-select: none;
      -webkit-user-select: none;
    }
    button:hover {
      background-color: #45a049;
    }
    .score-container {
      margin-bottom: 10px;
      font-size: 20px;
      font-weight: bold;
    }
    .game-over {
      position: absolute;
      background-color: rgba(0, 0, 0, 0.7);
      color: white;
      padding: 20px;
      border-radius: 10px;
      text-align: center;
      display: none;
      z-index: 10;
    }
    .game-over h2 {
      margin-top: 0;
    }
    
    /* Joystick styles */
    .joystick-container {
      position: relative;
      width: 150px;
      height: 150px;
      margin-top: 20px;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
    }
    .joystick-base {
      position: absolute;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background-color: rgba(0, 0, 0, 0.1);
      border: 2px solid #333;
    }
    .joystick-stick {
      position: absolute;
      width: 40%;
      height: 40%;
      border-radius: 50%;
      background-color: #4CAF50;
      border: 2px solid #2E7D32;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      cursor: pointer;
    }
    .d-pad {
      display: grid;
      grid-template-columns: repeat(3, 50px);
      grid-template-rows: repeat(3, 50px);
      gap: 2px;
      margin-top: 20px;
    }
    .d-pad button {
      width: 50px;
      height: 50px;
      padding: 0;
      background-color: #4CAF50;
      border: none;
      border-radius: 8px;
      font-size: 24px;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }
    .d-pad button:active {
      background-color: #3e8e41;
    }
    .d-pad .spacer {
      background: none;
      border: none;
    }
  </style>
</head>
<body>
  <div class="game-container">
    <div class="score-container">Score: <span id="score">0</span></div>
    <canvas id="game-board" width="300" height="300"></canvas>
    <div class="controls">
      <button id="start-btn">Start Game</button>
      <button id="reset-btn">Reset</button>
    </div>
    
    <!-- D-Pad Control for Mobile -->
    <div class="d-pad">
      <div class="spacer"></div>
      <button id="up-btn">↑</button>
      <div class="spacer"></div>
      <button id="left-btn">←</button>
      <div class="spacer"></div>
      <button id="right-btn">→</button>
      <div class="spacer"></div>
      <button id="down-btn">↓</button>
      <div class="spacer"></div>
    </div>
    
    <div class="game-over" id="game-over">
      <h2>Game Over!</h2>
      <p>Your final score: <span id="final-score">0</span></p>
      <button id="play-again-btn">Play Again</button>
    </div>
  </div>

  <script>
    // Game variables
    const canvas = document.getElementById('game-board');
    const ctx = canvas.getContext('2d');
    const startBtn = document.getElementById('start-btn');
    const resetBtn = document.getElementById('reset-btn');
    const gameOverElement = document.getElementById('game-over');
    const finalScoreElement = document.getElementById('final-score');
    const playAgainBtn = document.getElementById('play-again-btn');
    const scoreElement = document.getElementById('score');
    
    // D-pad buttons
    const upBtn = document.getElementById('up-btn');
    const downBtn = document.getElementById('down-btn');
    const leftBtn = document.getElementById('left-btn');
    const rightBtn = document.getElementById('right-btn');
    
    // Make canvas responsive
    function resizeCanvas() {
      const containerWidth = document.querySelector('.game-container').offsetWidth;
      const size = Math.min(containerWidth - 20, 400); // Max size 400px
      canvas.style.width = size + 'px';
      canvas.style.height = size + 'px';
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();
    
    const gridSize = 15;
    const tileCount = canvas.width / gridSize;
    
    let snake = [];
    let food = {};
    let dx = gridSize;
    let dy = 0;
    let score = 0;
    let gameRunning = false;
    let gameLoop;
    
    // Initialize the game
    function initGame() {
      // Reset snake
      snake = [
        { x: 5 * gridSize, y: 5 * gridSize },
        { x: 4 * gridSize, y: 5 * gridSize },
        { x: 3 * gridSize, y: 5 * gridSize }
      ];
      
      // Reset direction
      dx = gridSize;
      dy = 0;
      
      // Reset score
      score = 0;
      scoreElement.textContent = score;
      
      // Place food
      placeFood();
      
      // Hide game over screen
      gameOverElement.style.display = 'none';
    }
    
    // Place food in a random position
    function placeFood() {
      // Generate random coordinates
      let randomX = Math.floor(Math.random() * tileCount) * gridSize;
      let randomY = Math.floor(Math.random() * tileCount) * gridSize;
      
      // Make sure food doesn't appear on the snake
      let foodOnSnake = true;
      while (foodOnSnake) {
        foodOnSnake = false;
        for (let i = 0; i < snake.length; i++) {
          if (snake[i].x === randomX && snake[i].y === randomY) {
            foodOnSnake = true;
            randomX = Math.floor(Math.random() * tileCount) * gridSize;
            randomY = Math.floor(Math.random() * tileCount) * gridSize;
            break;
          }
        }
      }
      
      food = {
        x: randomX,
        y: randomY
      };
    }
    
    // Draw everything on the canvas
    function draw() {
      // Clear canvas
      ctx.fillStyle = '#222';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      
      // Draw snake
      for (let i = 0; i < snake.length; i++) {
        ctx.fillStyle = i === 0 ? '#4CAF50' : '#8BC34A';
        ctx.fillRect(snake[i].x, snake[i].y, gridSize, gridSize);
        
        // Draw border for the snake segments
        ctx.strokeStyle = '#2E7D32';
        ctx.strokeRect(snake[i].x, snake[i].y, gridSize, gridSize);
      }
      
      // Draw food
      ctx.fillStyle = '#FF5722';
      ctx.beginPath();
      ctx.arc(
        food.x + gridSize / 2,
        food.y + gridSize / 2,
        gridSize / 2,
        0,
        Math.PI * 2
      );
      ctx.fill();
    }
    
    // Update game state
    function update() {
      // Move snake
      const head = { x: snake[0].x + dx, y: snake[0].y + dy };
      
      // Check for wall collision
      if (
        head.x < 0 ||
        head.y < 0 ||
        head.x >= canvas.width ||
        head.y >= canvas.height
      ) {
        gameOver();
        return;
      }
      
      // Check for self collision
      for (let i = 0; i < snake.length; i++) {
        if (head.x === snake[i].x && head.y === snake[i].y) {
          gameOver();
          return;
        }
      }
      
      // Insert new head
      snake.unshift(head);
      
      // Check if food was eaten
      if (head.x === food.x && head.y === food.y) {
        // Increase score
        score += 10;
        scoreElement.textContent = score;
        
        // Place new food
        placeFood();
      } else {
        // Remove tail
        snake.pop();
      }
    }
    
    // Game loop
    function gameStep() {
      update();
      draw();
    }
    
    // Game over function
    function gameOver() {
      clearInterval(gameLoop);
      gameRunning = false;
      finalScoreElement.textContent = score;
      gameOverElement.style.display = 'block';
    }
    
    // Start game
    function startGame() {
      if (!gameRunning) {
        initGame();
        gameRunning = true;
        gameLoop = setInterval(gameStep, 100);
      }
    }
    
    // Reset game
    function resetGame() {
      clearInterval(gameLoop);
      gameRunning = false;
      initGame();
      draw();
    }
    
    // Change snake direction
    function changeDirection(newDx, newDy) {
      // Only change direction if not moving in the opposite direction
      if (gameRunning && ((dx !== -newDx) || (dy !== -newDy))) {
        if (newDx !== 0 && dx === 0) {
          dx = newDx;
          dy = 0;
        } else if (newDy !== 0 && dy === 0) {
          dx = 0;
          dy = newDy;
        }
      }
    }
    
    // Event listeners for buttons
    startBtn.addEventListener('click', startGame);
    resetBtn.addEventListener('click', resetGame);
    playAgainBtn.addEventListener('click', startGame);
    
    // D-pad event listeners
    upBtn.addEventListener('touchstart', function(e) {
      e.preventDefault();
      changeDirection(0, -gridSize);
    });
    
    downBtn.addEventListener('touchstart', function(e) {
      e.preventDefault();
      changeDirection(0, gridSize);
    });
    
    leftBtn.addEventListener('touchstart', function(e) {
      e.preventDefault();
      changeDirection(-gridSize, 0);
    });
    
    rightBtn.addEventListener('touchstart', function(e) {
      e.preventDefault();
      changeDirection(gridSize, 0);
    });
    
    // Also make D-pad work with mouse clicks for testing on desktop
    upBtn.addEventListener('click', function() {
      changeDirection(0, -gridSize);
    });
    
    downBtn.addEventListener('click', function() {
      changeDirection(0, gridSize);
    });
    
    leftBtn.addEventListener('click', function() {
      changeDirection(-gridSize, 0);
    });
    
    rightBtn.addEventListener('click', function() {
      changeDirection(gridSize, 0);
    });
    
    // Keyboard controls
    document.addEventListener('keydown', function(event) {
      // Prevent the default action (scrolling)
      if([32, 37, 38, 39, 40].indexOf(event.keyCode) > -1) {
        event.preventDefault();
      }
      
      // Arrow keys
      switch (event.key) {
        case 'ArrowLeft':
          changeDirection(-gridSize, 0);
          break;
        case 'ArrowUp':
          changeDirection(0, -gridSize);
          break;
        case 'ArrowRight':
          changeDirection(gridSize, 0);
          break;
        case 'ArrowDown':
          changeDirection(0, gridSize);
          break;
      }
    });
    
    // Handle touch events for mobile swipe controls (optional additional method)
    let touchStartX = 0;
    let touchStartY = 0;
    
    document.addEventListener('touchstart', function(e) {
      touchStartX = e.changedTouches[0].screenX;
      touchStartY = e.changedTouches[0].screenY;
    }, false);
    
    document.addEventListener('touchend', function(e) {
      const touchEndX = e.changedTouches[0].screenX;
      const touchEndY = e.changedTouches[0].screenY;
      
      const diffX = touchStartX - touchEndX;
      const diffY = touchStartY - touchEndY;
      
      // Only handle swipes on the game board
      const rect = canvas.getBoundingClientRect();
      const touchX = e.changedTouches[0].clientX;
      const touchY = e.changedTouches[0].clientY;
      
      if (touchX >= rect.left && touchX <= rect.right && 
          touchY >= rect.top && touchY <= rect.bottom) {
        
        // Determine swipe direction based on which difference is greater
        if (Math.abs(diffX) > Math.abs(diffY)) {
          // Horizontal swipe
          if (diffX > 0) {
            changeDirection(-gridSize, 0); // Swipe left
          } else {
            changeDirection(gridSize, 0); // Swipe right
          }
        } else {
          // Vertical swipe
          if (diffY > 0) {
            changeDirection(0, -gridSize); // Swipe up
          } else {
            changeDirection(0, gridSize); // Swipe down
          }
        }
      }
    }, false);
    
    // Initialize game on load
    window.onload = function() {
      initGame();
      draw();
    };
  </script>
</body>
</html>
